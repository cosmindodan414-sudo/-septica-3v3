<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Șeptică 3v3</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at center,#263827 0,#101812 55%,#070907 100%);
  color:white;
  overflow-x:hidden;
}

.hidden{display:none!important}

button,input{
  font-family:inherit;
}

/* =========================
   LOBBY
========================= */

#lobby{
  max-width:430px;
  margin:70px auto;
  padding:25px;
  text-align:center;
  background:#07120ed9;
  border:1px solid #ffffff20;
  border-radius:22px;
}

#lobby h1{
  font-size:34px;
  margin:0 0 5px;
}

#lobby input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:1px solid #ffffff25;
  border-radius:12px;
  background:#101c18;
  color:white;
  font-size:17px;
}

.mainButton{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:7px;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
  background:#46a832;
  color:white;
}

.secondaryButton{
  background:#2362ba;
}

/* =========================
   TOP BAR
========================= */

#game{
  min-height:100vh;
  padding:12px;
}

.topbar{
  display:grid;
  grid-template-columns:190px 1fr 110px;
  gap:12px;
  align-items:center;
  max-width:1500px;
  margin:auto;
}

.roomBox,
.scoreBox,
.hostBox{
  background:#071019ec;
  border:1px solid #ffffff1c;
  border-radius:15px;
  min-height:80px;
}

.roomBox{
  padding:10px 16px;
}

.roomBox small{
  opacity:.7;
}

.roomCode{
  display:block;
  font-size:26px;
  font-weight:bold;
  color:#ffd143;
  letter-spacing:3px;
  margin-top:3px;
}

.scoreBox{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
  padding:8px 20px;
}

.team1{
  color:#89ef4e;
}

.team2{
  color:#57a1ff;
}

.scoreTeam{
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.scoreNumber{
  font-size:42px;
  font-weight:bold;
}

.scoreDash{
  font-size:28px;
  opacity:.7;
}

.hostBox{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffd143;
  font-weight:bold;
}

/* =========================
   GAME AREA
========================= */

.gameLayout{
  max-width:1500px;
  margin:12px auto 0;
  display:grid;
  grid-template-columns:1fr 190px;
  gap:12px;
}

.tableArea{
  position:relative;
  min-height:690px;
}

/* =========================
   TABLE
========================= */

.gameTable{
  position:absolute;
  width:min(82vw,1100px);
  height:570px;

  left:50%;
  top:55px;
  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(ellipse,#237638 0%,#15592a 68%,#0a3c1c 100%);

  border:18px solid #5d321b;

  box-shadow:
    inset 0 0 45px #0007,
    0 20px 45px #0009;
}

.gameTable:after{
  content:"";
  position:absolute;
  inset:-10px;
  border-radius:50%;
  border:4px solid #8e532b;
  pointer-events:none;
}

/* =========================
   PLAYERS
========================= */

.player{
  position:absolute;
  width:145px;
  text-align:center;
  z-index:5;
}

.avatar{
  width:90px;
  height:90px;
  margin:auto;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:58px;

  background:linear-gradient(145deg,#34495e,#15202b);

  border:4px solid #ffffff25;

  box-shadow:0 8px 18px #0008;

  transition:.25s;
}

.player.active .avatar{
  border-color:#b8ff36;
  box-shadow:
    0 0 10px #b8ff36,
    0 0 28px #9dff21;
  transform:scale(1.08);
}

.playerName{
  display:inline-block;
  margin-top:4px;
  padding:5px 10px;

  background:#07100dde;

  border-radius:9px;

  font-weight:bold;
}

.playerTeam{
  display:inline-block;
  font-size:13px;
  margin-top:3px;
  padding:4px 8px;
  border-radius:7px;
}

.playerTeam.t1{
  background:#236e17;
}

.playerTeam.t2{
  background:#153e83;
}

.cardCount{
  font-size:12px;
  opacity:.8;
  margin-top:4px;
}

.kick{
  background:#b82020;
  color:white;
  border:0;
  border-radius:7px;
  padding:5px 8px;
  margin-top:5px;
  cursor:pointer;
}

/* pozițiile celor 6 */

.p0{
  left:7%;
  top:16%;
}

.p1{
  left:43%;
  top:-7%;
}

.p2{
  right:7%;
  top:16%;
}

.p3{
  right:5%;
  bottom:7%;
}

.p4{
  left:43%;
  bottom:-9%;
}

.p5{
  left:5%;
  bottom:7%;
}

/* =========================
   TABLE CARDS
========================= */

.centerCards{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  display:flex;
  justify-content:center;
  align-items:center;

  min-width:250px;
  min-height:160px;

  z-index:3;
}

.playedCard{
  margin-left:-16px;
  transform:rotate(var(--r));
}

/* =========================
   CARDS
========================= */

.card{
  position:relative;

  width:78px;
  height:112px;

  background:#fffaf0;
  border:1px solid #d8cfbc;
  border-radius:9px;

  color:#131313;

  box-shadow:0 5px 10px #0007;

  cursor:pointer;
}

.card.red{
  color:#cf241c;
}

.cardTop{
  position:absolute;
  top:5px;
  left:7px;

  font-family:Georgia,serif;
  font-size:23px;
  font-weight:bold;

  line-height:20px;
}

.cardCenter{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:Georgia,serif;
  font-size:48px;
  font-weight:bold;
}

.faceCenter{
  font-size:42px;
}

.cardBottom{
  position:absolute;
  right:7px;
  bottom:5px;

  font-family:Georgia,serif;
  font-size:22px;
  font-weight:bold;

  transform:rotate(180deg);
}

.card.disabled{
  opacity:.65;
  pointer-events:none;
}

/* =========================
   HAND
========================= */

.handArea{
  position:relative;
  z-index:20;

  max-width:1050px;
  margin:-15px auto 0;

  padding:12px;

  background:#071019e8;
  border:1px solid #ffffff20;
  border-radius:16px;
}

.hand{
  display:flex;
  justify-content:center;
  gap:5px;
  overflow-x:auto;
  padding:7px;
}

.hand .card{
  flex:0 0 78px;
  transition:.15s;
}

.hand .card:not(.disabled):active{
  transform:translateY(-10px);
}

.turnMessage{
  text-align:center;
  font-weight:bold;
  color:#ffd143;
  margin-bottom:6px;
}

/* =========================
   RIGHT INFO
========================= */

.infoPanel{
  background:#071019ec;
  border:1px solid #ffffff1e;
  border-radius:15px;
  padding:15px;
  height:max-content;
}

.infoTitle{
  opacity:.7;
  font-size:14px;
  margin-top:12px;
}

.infoValue{
  font-size:18px;
  margin-top:4px;
}

#statusMessage{
  color:#91ff67;
}

/* =========================
   START BUTTON
========================= */

#startButton{
  position:fixed;
  z-index:100;
  bottom:20px;
  right:20px;

  background:#42a62d;
  color:white;
  border:0;
  border-radius:14px;

  padding:15px 25px;

  font-size:18px;
  font-weight:bold;

  box-shadow:0 7px 20px #0007;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  body{
    overflow:auto;
  }

  #game{
    padding:5px;
  }

  .topbar{
    grid-template-columns:100px 1fr 65px;
    gap:5px;
  }

  .roomBox,
  .scoreBox,
  .hostBox{
    min-height:62px;
  }

  .roomCode{
    font-size:17px;
  }

  .scoreBox{
    gap:7px;
    padding:5px;
  }

  .scoreTeam{
    font-size:11px;
  }

  .scoreNumber{
    font-size:27px;
  }

  .gameLayout{
    display:block;
  }

  .infoPanel{
    display:none;
  }

  .tableArea{
    min-height:510px;
  }

  .gameTable{
    top:50px;
    width:97vw;
    height:420px;
    border-width:10px;
  }

  .player{
    width:92px;
  }

  .avatar{
    width:62px;
    height:62px;
    font-size:39px;
    border-width:3px;
  }

  .playerName{
    font-size:11px;
    padding:3px 5px;
  }

  .playerTeam{
    font-size:9px;
    padding:2px 5px;
  }

  .cardCount{
    display:none;
  }

  .p0{
    left:-1%;
    top:18%;
  }

  .p1{
    left:38%;
    top:-7%;
  }

  .p2{
    right:-1%;
    top:18%;
  }

  .p3{
    right:0%;
    bottom:5%;
  }

  .p4{
    left:38%;
    bottom:-8%;
  }

  .p5{
    left:0%;
    bottom:5%;
  }

  .centerCards{
    transform:translate(-50%,-50%) scale(.72);
  }

  .handArea{
    margin:-5px 4px 10px;
  }

  .hand{
    justify-content:flex-start;
  }

  .card{
    width:61px;
    height:88px;
  }

  .hand .card{
    flex-basis:61px;
  }

  .cardTop{
    font-size:18px;
    line-height:16px;
  }

  .cardCenter{
    font-size:36px;
  }

  .cardBottom{
    font-size:17px;
  }

  .faceCenter{
    font-size:31px;
  }
}
</style>
</head>

<body>

<!-- =======================
     LOBBY
======================= -->

<div id="lobby">

<h1>🃏 Șeptică 3v3</h1>

<p>6 jucători • Echipa 1 vs Echipa 2</p>

<input id="name" placeholder="Numele tău">

<button class="mainButton" onclick="createRoom()">
Creează cameră
</button>

<input
  id="code"
  inputmode="numeric"
  maxlength="6"
  placeholder="Cod cameră"
>

<button
  class="mainButton secondaryButton"
  onclick="joinRoom()"
>
Intră în cameră
</button>

<p id="error"></p>

</div>


<!-- =======================
     GAME
======================= -->

<div id="game" class="hidden">

<div class="topbar">

<div class="roomBox">

<small>Cod cameră</small>

<span id="roomCode" class="roomCode">
------
</span>

</div>


<div class="scoreBox">

<div class="scoreTeam team1">
ECHIPA 1
<br>
<span id="score1" class="scoreNumber">
0
</span>
</div>

<div class="scoreDash">
-
</div>

<div class="scoreTeam team2">
ECHIPA 2
<br>
<span id="score2" class="scoreNumber">
0
</span>
</div>

</div>


<div class="hostBox">
👑 Host
</div>

</div>


<div class="gameLayout">

<div>

<div class="tableArea">

<div class="gameTable">

<div id="players"></div>

<div
  id="centerCards"
  class="centerCards"
></div>

</div>

</div>


<div class="handArea">

<div
  id="turnMessage"
  class="turnMessage"
>
Așteptăm jucătorii...
</div>

<div
  id="hand"
  class="hand"
></div>

</div>

</div>


<div class="infoPanel">

<div class="infoTitle">
Prima carte
</div>

<div
  id="firstCard"
  class="infoValue"
>
-
</div>


<div class="infoTitle">
Tăieri permise
</div>

<div
  id="cutsAllowed"
  class="infoValue"
>
7, 8
</div>


<div class="infoTitle">
Cărți pe masă
</div>

<div
  id="cardsPlayed"
  class="infoValue"
>
0
</div>


<div class="infoTitle">
Mesaj
</div>

<div
  id="statusMessage"
  class="infoValue"
>
Așteptăm...
</div>

</div>

</div>


<button
  id="startButton"
  class="hidden"
  onclick="startGame()"
>
▶ Pornește jocul
</button>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket=io();

let roomCode=null;
let mySeat=null;
let state=null;
let hand=[];

const avatars=[
  '🧑🏻',
  '👨🏻',
  '👩🏻',
  '🧑🏻‍💻',
  '👨🏻‍🦱',
  '👩🏼'
];

function e(id){
  return document.getElementById(id);
}

/* =======================
   ROOM
======================= */

function createRoom(){

  socket.emit(
    'createRoom',
    {
      name:e('name').value.trim()
    },
    response=>{

      if(!response.ok){
        return showError(response.error);
      }

      enter(
        response.code,
        response.seat
      );

    }
  );

}

function joinRoom(){

  socket.emit(
    'joinRoom',
    {
      code:e('code').value.trim(),
      name:e('name').value.trim()
    },
    response=>{

      if(!response.ok){
        return showError(response.error);
      }

      enter(
        response.code,
        response.seat
      );

    }
  );

}

function enter(code,seat){

  roomCode=code;
  mySeat=seat;

  e('lobby')
    .classList
    .add('hidden');

  e('game')
    .classList
    .remove('hidden');

  e('roomCode').textContent=code;

}


/* =======================
   START
======================= */

function startGame(){

  socket.emit(
    'startGame',
    {
      code:roomCode
    },
    response=>{

      if(!response.ok){
        alert(response.error);
      }

    }
  );

}


/* =======================
   PLAY CARD
======================= */

function playCard(index){

  socket.emit(
    'playCard',
    {
      code:roomCode,
      index
    },
    response=>{

      if(!response.ok){
        alert(response.error);
      }

    }
  );

}


/* =======================
   KICK
======================= */

function kickPlayer(seat){

  if(
    !confirm(
      `Dai afară Jucătorul ${seat+1}?`
    )
  ){
    return;
  }

  socket.emit(
    'kickPlayer',
    {
      code:roomCode,
      seat
    },
    response=>{

      if(!response.ok){
        alert(response.error);
      }

    }
  );

}

socket.on(
  'kicked',
  ()=>{

    alert(
      'Host-ul te-a dat afară.'
    );

    location.reload();

  }
);


/* =======================
   SOCKET STATE
======================= */

socket.on(
  'state',
  s=>{

    state=s;

    render();

  }
);

socket.on(
  'hand',
  h=>{

    hand=h;

    render();

  }
);


/* =======================
   CARD HTML
======================= */

function cardHTML(card){

  const red=
    card.suit==='♥' ||
    card.suit==='♦';

  let center=card.suit;

  if(card.rank==='K'){
    center='♚';
  }

  if(card.rank==='Q'){
    center='♛';
  }

  if(card.rank==='J'){
    center='♜';
  }

  return `
    <div class="cardTop">
      ${card.rank}<br>${card.suit}
    </div>

    <div class="cardCenter ${['J','Q','K'].includes(card.rank)?'faceCenter':''}">
      ${center}
    </div>

    <div class="cardBottom">
      ${card.rank}<br>${card.suit}
    </div>
  `;

}

function cardIsRed(card){

  return(
    card.suit==='♥' ||
    card.suit==='♦'
  );

}


/* =======================
   RENDER
======================= */

function render(){

  if(!state){
    return;
  }

  e('score1').textContent=
    state.scoreA ?? 0;

  e('score2').textContent=
    state.scoreB ?? 0;

  e('statusMessage').textContent=
    state.message || '';

  e('turnMessage').textContent=
    state.started
      ?
      (
        state.turn===mySeat
        ? '🟢 Rândul tău'
        : `Rândul Jucătorului ${state.turn+1}`
      )
      :
      'Așteptăm jucătorii...';


  /* START */

  const host=
    socket.id===state.hostId;

  e('startButton')
    .classList
    .toggle(
      'hidden',
      !(
        host &&
        state.players.length===6 &&
        !state.started
      )
    );


  /* PLAYERS */

  const players=e('players');

  players.innerHTML='';

  state.players.forEach(
    (player,index)=>{

      const box=
        document.createElement('div');

      box.className=
        `player p${index}`;

      if(
        state.started &&
        state.turn===index
      ){
        box.classList.add('active');
      }

      box.innerHTML=`

        <div class="avatar">
          ${avatars[index]}
        </div>

        <div class="playerName">
          Jucător ${index+1}
          ${index===mySeat?' (Tu)':''}
        </div>

        <br>

        <div class="playerTeam ${player.team===1?'t1':'t2'}">
          Echipa ${player.team}
        </div>

        <div class="cardCount">
          ${state.handCounts[index] ?? 0} cărți
        </div>

        ${
          host &&
          index!==0 &&
          !state.started
          ?
          `
          <button
            class="kick"
            onclick="kickPlayer(${index})"
          >
          ✕ Dă afară
          </button>
          `
          :
          ''
        }

      `;

      players.appendChild(box);

    }
  );


  /* TABLE */

  const table=
    state.table ||
    state.trick ||
    [];

  const center=
    e('centerCards');

  center.innerHTML='';

  table.forEach(
    (play,index)=>{

      const card=
        document.createElement('div');

      card.className='card playedCard';

      if(cardIsRed(play.card)){
        card.classList.add('red');
      }

      const rotations=[
        '-12deg',
        '8deg',
        '-4deg',
        '13deg',
        '-8deg',
        '5deg'
      ];

      card.style.setProperty(
        '--r',
        rotations[index % rotations.length]
      );

      card.innerHTML=
        cardHTML(play.card);

      center.appendChild(card);

    }
  );


  e('cardsPlayed').textContent=
    table.length;


  if(
    state.openingRank
  ){

    e('firstCard').textContent=
      state.openingRank;

    e('cutsAllowed').textContent=
      `${state.openingRank}, 7 sau 8`;

  }else{

    e('firstCard').textContent='-';

    e('cutsAllowed').textContent=
      '7 și 8';

  }


  /* HAND */

  const myHand=e('hand');

  myHand.innerHTML='';

  hand.forEach(
    (card,index)=>{

      const cardElement=
        document.createElement('div');

      cardElement.className='card';

      if(cardIsRed(card)){
        cardElement.classList.add('red');
      }

      const enabled=
        state.started &&
        state.turn===mySeat;

      if(!enabled){
        cardElement.classList.add('disabled');
      }

      cardElement.innerHTML=
        cardHTML(card);

      if(enabled){

        cardElement.onclick=
          ()=>playCard(index);

      }

      myHand.appendChild(
        cardElement
      );

    }
  );

}


/* =======================
   ERRORS
======================= */

function showError(message){

  e('error').textContent=
    message;

}

</script>

</body>
</html>
