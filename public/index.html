<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Șeptică 3v3</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#080b09;
  color:white;
}

body{
  background:
    radial-gradient(circle at 50% 35%,#3a2415 0,#15100b 48%,#050706 100%);
}

/* ---------- LOBBY ---------- */

#lobby{
  width:min(92%,430px);
  margin:70px auto;
  padding:28px;
  background:#07110eeF;
  border:1px solid #ffffff20;
  border-radius:22px;
  text-align:center;
  box-shadow:0 15px 45px #000a;
}

#lobby h1{
  margin:0 0 8px;
  font-size:36px;
}

#lobby input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:1px solid #ffffff20;
  border-radius:12px;
  background:#101a17;
  color:white;
  font-size:17px;
}

.mainBtn{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:700;
  color:white;
  background:#2d8c35;
}

.blueBtn{
  background:#245eae;
}

.hidden{display:none!important}

/* ---------- TOP ---------- */

#game{
  min-height:100vh;
  padding:12px;
}

.top{
  max-width:1500px;
  margin:auto;
  display:grid;
  grid-template-columns:240px 1fr 160px;
  gap:12px;
  align-items:center;
}

.glass{
  background:#071019ee;
  border:1px solid #ffffff20;
  border-radius:15px;
  box-shadow:0 7px 22px #0008;
}

.room{
  min-height:88px;
  padding:13px 18px;
}

.roomTitle{
  opacity:.7;
  font-size:15px;
}

.roomCode{
  display:block;
  color:#ffd23f;
  font-size:31px;
  font-weight:900;
  letter-spacing:3px;
  margin-top:4px;
}

.score{
  min-height:88px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:32px;
}

.teamLabel{
  text-align:center;
  font-size:20px;
  font-weight:900;
}

.team1{color:#92ef55}
.team2{color:#579dff}

.scoreN{
  display:inline-block;
  font-size:46px;
  margin-left:18px;
}

.dash{
  font-size:30px;
}

.host{
  min-height:88px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffd441;
  font-size:18px;
  font-weight:bold;
}

/* ---------- MAIN LAYOUT ---------- */

.gameGrid{
  max-width:1500px;
  margin:10px auto 0;
  display:grid;
  grid-template-columns:1fr 190px;
  gap:12px;
}

.leftSide{
  min-width:0;
}

.tableZone{
  position:relative;
  height:690px;
}

/* ---------- TABLE ---------- */

.table{
  position:absolute;
  width:min(1100px,82vw);
  height:560px;
  left:50%;
  top:60px;
  transform:translateX(-50%);
  border-radius:50%;

  background:
    radial-gradient(ellipse at center,#287a3c 0%,#195d2d 62%,#0c3f20 100%);

  border:18px solid #6c3a1d;

  box-shadow:
    inset 0 0 55px #0007,
    0 28px 60px #000b;
}

.table:after{
  content:"";
  position:absolute;
  inset:-10px;
  border:5px solid #9a5b31;
  border-radius:50%;
  pointer-events:none;
}

/* ---------- PLAYERS ---------- */

.player{
  position:absolute;
  width:160px;
  text-align:center;
  z-index:10;
}

.avatarBox{
  position:relative;
  width:125px;
  height:125px;
  margin:auto;
}

.avatar{
  width:125px;
  height:125px;
  object-fit:contain;
  filter:drop-shadow(0 8px 8px #0009);
  transition:.2s;
}

.player.active .avatar{
  filter:
    drop-shadow(0 0 7px #b8ff32)
    drop-shadow(0 0 18px #8dff00);
  transform:scale(1.06);
}

.playerTitle{
  display:inline-block;
  margin-top:-5px;
  background:#111b;
  border-radius:9px;
  padding:5px 10px;
  font-size:17px;
  font-weight:bold;
}

.playerTeam{
  display:inline-block;
  margin-top:4px;
  padding:4px 9px;
  border-radius:7px;
  font-size:13px;
}

.t1{background:#266f1d}
.t2{background:#14438c}

.kick{
  display:block;
  margin:5px auto;
  border:0;
  border-radius:7px;
  padding:6px 9px;
  background:#b72a2a;
  color:white;
  font-weight:bold;
}

/* positions */
.p0{left:6%;top:14%}
.p1{left:43%;top:-10%}
.p2{right:6%;top:14%}
.p3{right:4%;bottom:4%}
.p4{left:43%;bottom:-11%}
.p5{left:4%;bottom:4%}

/* ---------- TABLE CARDS ---------- */

.center{
  position:absolute;
  left:50%;
  top:49%;
  transform:translate(-50%,-50%);
  width:320px;
  min-height:160px;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:5;
}

.played{
  margin-left:-22px;
  transform:rotate(var(--rot));
}

/* ---------- CARD ---------- */

.card{
  position:relative;
  width:90px;
  height:132px;
  flex:0 0 90px;
  background:#fffaf0;
  border:1px solid #d5cbb5;
  border-radius:10px;
  color:#121212;
  box-shadow:0 6px 13px #0008;
  overflow:hidden;
  user-select:none;
}

.red{color:#d1241c}

.topRank{
  position:absolute;
  top:6px;
  left:8px;
  font-family:Georgia,serif;
  font-size:25px;
  font-weight:bold;
  line-height:20px;
}

.centerSuit{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:56px;
  font-family:Georgia,serif;
}

.face{
  font-size:44px;
}

.bottomRank{
  position:absolute;
  right:8px;
  bottom:6px;
  transform:rotate(180deg);
  font-family:Georgia,serif;
  font-size:24px;
  font-weight:bold;
  line-height:19px;
}

/* ---------- HAND ---------- */

.handPanel{
  position:relative;
  z-index:20;
  width:min(1100px,94vw);
  margin:-5px auto 0;
  padding:8px 10px 12px;
  background:#071019ef;
  border:1px solid #ffffff18;
  border-radius:14px;
  box-shadow:0 6px 25px #0008;
}

.turn{
  text-align:center;
  color:#ffd746;
  font-size:18px;
  font-weight:bold;
  margin:2px 0 8px;
}

.hand{
  display:flex;
  justify-content:center;
  gap:6px;
  overflow-x:auto;
}

.hand .card{
  cursor:pointer;
  transition:.15s;
}

.hand .card.canPlay:active{
  transform:translateY(-12px);
}

.disabled{
  opacity:.62;
  pointer-events:none;
}

/* ---------- SIDE INFO ---------- */

.side{
  padding:15px;
  height:max-content;
}

.infoTitle{
  margin-top:13px;
  color:#bbb;
  font-size:15px;
}

.info{
  margin-top:5px;
  font-size:19px;
}

.green{
  color:#8fff60;
}

/* ---------- START ---------- */

#startBtn{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:100;
  border:0;
  border-radius:13px;
  padding:14px 22px;
  background:#3b9b32;
  color:white;
  font-size:18px;
  font-weight:bold;
}

/* ---------- MOBILE ---------- */

@media(max-width:850px){

  #game{padding:5px}

  .top{
    grid-template-columns:105px 1fr 65px;
    gap:5px;
  }

  .room,.score,.host{
    min-height:62px;
  }

  .room{
    padding:8px;
  }

  .roomTitle{font-size:10px}

  .roomCode{
    font-size:18px;
    letter-spacing:1px;
  }

  .score{
    gap:7px;
  }

  .teamLabel{
    font-size:11px;
  }

  .scoreN{
    font-size:27px;
    margin-left:5px;
  }

  .host{
    font-size:11px;
  }

  .gameGrid{
    display:block;
  }

  .side{
    display:none;
  }

  .tableZone{
    height:505px;
  }

  .table{
    top:55px;
    width:97vw;
    height:410px;
    border-width:10px;
  }

  .player{
    width:95px;
  }

  .avatarBox,
  .avatar{
    width:76px;
    height:76px;
  }

  .playerTitle{
    font-size:10px;
    padding:3px 5px;
  }

  .playerTeam{
    font-size:9px;
    padding:2px 5px;
  }

  .kick{
    font-size:9px;
    padding:4px;
  }

  .p0{left:-2%;top:18%}
  .p1{left:38%;top:-7%}
  .p2{right:-2%;top:18%}
  .p3{right:0;bottom:4%}
  .p4{left:38%;bottom:-8%}
  .p5{left:0;bottom:4%}

  .center{
    transform:translate(-50%,-50%) scale(.66);
  }

  .handPanel{
    width:98%;
  }

  .hand{
    justify-content:flex-start;
  }

  .card{
    width:64px;
    height:94px;
    flex-basis:64px;
  }

  .topRank{
    font-size:18px;
    line-height:15px;
  }

  .bottomRank{
    font-size:17px;
    line-height:14px;
  }

  .centerSuit{
    font-size:38px;
  }

  .face{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div id="lobby">
  <h1>🃏 Șeptică 3v3</h1>
  <p>6 jucători • Echipa 1 vs Echipa 2</p>

  <input id="name" placeholder="Numele tău">

  <button class="mainBtn" onclick="createRoom()">
    Creează cameră
  </button>

  <input id="code" placeholder="Cod cameră" maxlength="6" inputmode="numeric">

  <button class="mainBtn blueBtn" onclick="joinRoom()">
    Intră în cameră
  </button>

  <p id="error"></p>
</div>

<div id="game" class="hidden">

  <div class="top">

    <div class="room glass">
      <div class="roomTitle">Cod cameră</div>
      <span id="roomCode" class="roomCode">------</span>
    </div>

    <div class="score glass">

      <div class="teamLabel team1">
        ECHIPA 1
        <span id="score1" class="scoreN">0</span>
      </div>

      <div class="dash">-</div>

      <div class="teamLabel team2">
        <span id="score2" class="scoreN">0</span>
        ECHIPA 2
      </div>

    </div>

    <div class="host glass">
      👑 Host
    </div>

  </div>

  <div class="gameGrid">

    <div class="leftSide">

      <div class="tableZone">

        <div class="table">

          <div id="players"></div>

          <div id="center" class="center"></div>

        </div>

      </div>

      <div class="handPanel">

        <div id="turn" class="turn">
          Așteptăm jucătorii...
        </div>

        <div id="hand" class="hand"></div>

      </div>

    </div>

    <div class="side glass">

      <div class="infoTitle">Prima carte:</div>
      <div id="firstCard" class="info">-</div>

      <div class="infoTitle">Tăieri permise:</div>
      <div id="cuts" class="info">7, 8</div>

      <div class="infoTitle">Cărți jucate:</div>
      <div id="playedCount" class="info">0</div>

      <div class="infoTitle">Mesaj:</div>
      <div id="message" class="info green">Așteptăm...</div>

    </div>

  </div>

  <button id="startBtn" class="hidden" onclick="startGame()">
    ▶ Pornește jocul
  </button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let roomCode = null;
let mySeat = null;
let state = null;
let myHand = [];

const avatars = [
  "/assets/player1.png",
  "/assets/player2.png",
  "/assets/player3.png",
  "/assets/player4.png",
  "/assets/player5.png",
  "/assets/player6.png"
];

function e(id){
  return document.getElementById(id);
}

function createRoom(){

  socket.emit(
    "createRoom",
    {name:e("name").value.trim()},
    r=>{
      if(!r.ok){
        return error(r.error);
      }

      enterRoom(r.code,r.seat);
    }
  );
}

function joinRoom(){

  socket.emit(
    "joinRoom",
    {
      code:e("code").value.trim(),
      name:e("name").value.trim()
    },
    r=>{
      if(!r.ok){
        return error(r.error);
      }

      enterRoom(r.code,r.seat);
    }
  );
}

function enterRoom(code,seat){

  roomCode = code;
  mySeat = seat;

  e("lobby").classList.add("hidden");
  e("game").classList.remove("hidden");

  e("roomCode").textContent = code;
}

function startGame(){

  socket.emit(
    "startGame",
    {code:roomCode},
    r=>{
      if(!r.ok){
        alert(r.error);
      }
    }
  );
}

function playCard(index){

  socket.emit(
    "playCard",
    {
      code:roomCode,
      index
    },
    r=>{
      if(!r.ok){
        alert(r.error);
      }
    }
  );
}

function kickPlayer(seat){

  if(!confirm(`Dai afară Jucătorul ${seat+1}?`)){
    return;
  }

  socket.emit(
    "kickPlayer",
    {
      code:roomCode,
      seat
    },
    r=>{
      if(!r.ok){
        alert(r.error);
      }
    }
  );
}

socket.on("kicked",()=>{

  alert("Host-ul te-a dat afară din cameră.");

  location.reload();
});

socket.on("state",s=>{
  state=s;
  render();
});

socket.on("hand",h=>{
  myHand=h;
  render();
});

function cardIsRed(card){
  return card.suit==="♥" || card.suit==="♦";
}

function cardHTML(card){

  let center = card.suit;

  if(card.rank==="J") center="♞";
  if(card.rank==="Q") center="♛";
  if(card.rank==="K") center="♚";

  return `
    <div class="topRank">
      ${card.rank}<br>${card.suit}
    </div>

    <div class="centerSuit ${["J","Q","K"].includes(card.rank)?"face":""}">
      ${center}
    </div>

    <div class="bottomRank">
      ${card.rank}<br>${card.suit}
    </div>
  `;
}

function render(){

  if(!state) return;

  e("score1").textContent = state.scoreA ?? 0;
  e("score2").textContent = state.scoreB ?? 0;

  e("message").textContent = state.message || "";

  const host = socket.id === state.hostId;

  e("startBtn").classList.toggle(
    "hidden",
    !(host && state.players.length===6 && !state.started)
  );

  e("turn").textContent =
    state.started
      ? (
          state.turn===mySeat
          ? "🟢 Rândul tău"
          : `Rândul Jucătorului ${state.turn+1}`
        )
      : `${state.players.length}/6 jucători la masă`;

  const players = e("players");

  players.innerHTML = "";

  state.players.forEach((player,index)=>{

    const box = document.createElement("div");

    box.className = `player p${index}`;

    if(state.started && state.turn===index){
      box.classList.add("active");
    }

    box.innerHTML = `
      <div class="avatarBox">

        <img
          class="avatar"
          src="${avatars[index]}"
          onerror="this.style.display='none'"
        >

      </div>

      <div class="playerTitle">
        Jucător ${index+1}
        ${index===mySeat?" (Tu)":""}
      </div>

      <br>

      <div class="playerTeam ${player.team===1?"t1":"t2"}">
        Echipa ${player.team}
      </div>

      ${
        host && index!==0 && !state.started
        ?
        `
        <button
          class="kick"
          onclick="kickPlayer(${index})"
        >
          ✕ Dă afară
        </button>
        `
        :
        ""
      }
    `;

    players.appendChild(box);
  });

  const table =
    state.table ||
    state.trick ||
    [];

  const center = e("center");

  center.innerHTML = "";

  const rotations = [
    "-14deg",
    "10deg",
    "-5deg",
    "13deg",
    "-10deg",
    "6deg"
  ];

  table.forEach((play,index)=>{

    const card = document.createElement("div");

    card.className = "card played";

    if(cardIsRed(play.card)){
      card.classList.add("red");
    }

    card.style.setProperty(
      "--rot",
      rotations[index % rotations.length]
    );

    card.innerHTML = cardHTML(play.card);

    center.appendChild(card);
  });

  e("playedCount").textContent = table.length;

  if(state.openingRank){

    e("firstCard").textContent =
      state.openingRank;

    e("cuts").textContent =
      `${state.openingRank}, 7 sau 8`;

  }else{

    e("firstCard").textContent = "-";
    e("cuts").textContent = "7 și 8";
  }

  const hand = e("hand");

  hand.innerHTML = "";

  myHand.forEach((card,index)=>{

    const c = document.createElement("div");

    c.className = "card";

    if(cardIsRed(card)){
      c.classList.add("red");
    }

    const canPlay =
      state.started &&
      state.turn===mySeat;

    if(canPlay){
      c.classList.add("canPlay");
      c.onclick = ()=>playCard(index);
    }else{
      c.classList.add("disabled");
    }

    c.innerHTML = cardHTML(card);

    hand.appendChild(c);
  });
}

function error(text){
  e("error").textContent = text;
}
</script>

</body>
</html>
