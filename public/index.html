<!DOCTYPE html>
<html lang="ro">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Șeptică 3v3</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:white;

  background:
    radial-gradient(
      circle at 50% 30%,
      #51321d,
      #20140c 45%,
      #070806
    );
}

.hidden{
  display:none!important;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   LOBBY
========================= */

#lobby{
  width:min(92%,440px);
  margin:45px auto;
  padding:25px;
  background:#07110ff2;
  border-radius:22px;
  text-align:center;
}

#lobby input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ffffff25;
  border-radius:10px;
  background:#111c18;
  color:white;
  font-size:16px;
}

.teamChoice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:10px 0;
}

.teamChoice button{
  padding:13px;
  border-radius:10px;
  border:2px solid transparent;
  color:white;
  font-weight:bold;
}

.choose1{
  background:#286c24;
}

.choose2{
  background:#174b91;
}

.teamChoice button.selected{
  border-color:#ffd642;
  box-shadow:0 0 12px #ffd64288;
}

.mainButton{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:0;
  border-radius:11px;
  background:#33983c;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.blue{
  background:#285faf;
}

#error{
  color:#ff8888;
}

/* =========================
   TOP
========================= */

#game{
  padding:10px;
}

.panel{
  background:#071019ef;
  border:1px solid #ffffff20;
  border-radius:14px;
}

.top{
  max-width:1450px;
  margin:auto;
  display:grid;
  grid-template-columns:170px 1fr 90px;
  gap:8px;
}

.room{
  padding:10px;
}

#roomCode{
  display:block;
  color:#ffd642;
  font-size:24px;
  font-weight:bold;
}

.score{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
}

.scoreNumber{
  font-size:38px;
  font-weight:bold;
}

.team1{
  color:#8ff05a;
}

.team2{
  color:#65a4ff;
}

.cardPoints{
  text-align:center;
  font-size:13px;
  color:#ddd;
  padding-bottom:5px;
}

.host{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffd642;
  font-weight:bold;
}

/* =========================
   GAME LAYOUT
========================= */

.layout{
  max-width:1450px;
  margin:10px auto;
  display:grid;
  grid-template-columns:1fr 280px;
  gap:10px;
}

.tableZone{
  position:relative;
  height:650px;
}

.table{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);

  width:min(1050px,82vw);
  height:530px;

  border-radius:50%;
  border:16px solid #6b391d;

  background:
    radial-gradient(
      ellipse,
      #2c7d3e,
      #175c2b 65%,
      #0b3d1e
    );

  box-shadow:
    inset 0 0 50px #0008,
    0 25px 50px #000b;
}

/* =========================
   PLAYERS
========================= */

.player{
  position:absolute;
  width:150px;
  text-align:center;
  z-index:10;
}

.avatar{
  width:120px;
  height:120px;
  object-fit:contain;
}

.player.active .avatar{
  filter:
    drop-shadow(0 0 8px #aaff30)
    drop-shadow(0 0 18px #86ff00);
}

.playerName{
  display:inline-block;
  background:#111d;
  border-radius:8px;
  padding:4px 8px;
  font-weight:bold;
}

.teamTag{
  display:inline-block;
  margin-top:3px;
  padding:3px 7px;
  border-radius:6px;
  font-size:12px;
}

.t1{
  background:#276f1c;
}

.t2{
  background:#17478d;
}

.kick{
  margin-top:4px;
  padding:5px;
  border:0;
  border-radius:6px;
  background:#ad2828;
  color:white;
}

.p0{left:5%;top:15%}
.p1{left:43%;top:-10%}
.p2{right:5%;top:15%}
.p3{right:4%;bottom:3%}
.p4{left:43%;bottom:-11%}
.p5{left:4%;bottom:3%}

/* =========================
   CARDS
========================= */

.centerCards{
  position:absolute;
  left:50%;
  top:49%;
  transform:translate(-50%,-50%);

  width:390px;
  min-height:180px;

  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-content:center;
  gap:7px;
}

.card{
  position:relative;

  width:82px;
  height:120px;

  flex:0 0 82px;

  border-radius:9px;

  background:#fff9ed;
  color:#111;

  border:1px solid #d2c7b1;

  box-shadow:0 5px 12px #0008;

  user-select:none;
}

.red{
  color:#ce241c;
}

.cardTop{
  position:absolute;
  top:5px;
  left:7px;
  font-family:Georgia,serif;
  font-size:22px;
  font-weight:bold;
}

.cardCenter{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}

.cardBottom{
  position:absolute;
  right:7px;
  bottom:5px;
  transform:rotate(180deg);
  font-family:Georgia,serif;
  font-size:21px;
  font-weight:bold;
}

/* cărțile mesei sunt mai mici */

.centerCards .card{
  width:57px;
  height:84px;
  flex-basis:57px;
}

.centerCards .cardTop{
  font-size:15px;
}

.centerCards .cardCenter{
  font-size:30px;
}

.centerCards .cardBottom{
  font-size:14px;
}

/* =========================
   HAND
========================= */

.handPanel{
  padding:10px;
  margin-top:-10px;
  text-align:center;
}

#hand{
  display:flex;
  justify-content:center;
  gap:5px;
  overflow-x:auto;
}

.canPlay{
  cursor:pointer;
}

.disabled{
  opacity:.55;
  pointer-events:none;
}

#turnMessage{
  margin-bottom:8px;
  color:#ffd642;
  font-weight:bold;
}

/* =========================
   BUTTONS
========================= */

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin:7px;
}

.action{
  padding:11px 15px;
  border:0;
  border-radius:9px;
  color:white;
  font-weight:bold;
}

.start{
  background:#369a3b;
}

.bot{
  background:#6a49b8;
}

.continue{
  background:#34a447;
}

.stop{
  background:#b93b3b;
}

.change1{
  background:#276f1c;
}

.change2{
  background:#17478d;
}

.result{
  padding:8px;
  color:#ffd642;
  font-weight:bold;
}

/* =========================
   RIGHT
========================= */

.side{
  padding:10px;
  min-width:0;
}

.tabs{
  display:flex;
  gap:4px;
  margin-bottom:8px;
}

.tab{
  flex:1;
  padding:9px 5px;
  border:0;
  border-radius:8px;
  background:#ffffff12;
  color:white;
}

.tab.active{
  background:#3577c7;
}

.tabPage{
  display:none;
}

.tabPage.active{
  display:block;
}

/* =========================
   CHAT
========================= */

#chatMessages{
  height:260px;
  overflow-y:auto;
  background:#02070680;
  border-radius:10px;
  padding:8px;
}

.chatMessage{
  margin:5px 0;
  padding:6px;
  background:#ffffff0e;
  border-radius:7px;
  word-break:break-word;
}

.chatName{
  color:#ffd642;
  font-weight:bold;
}

.chatForm{
  display:flex;
  gap:5px;
  margin-top:7px;
}

#chatInput{
  min-width:0;
  flex:1;
  padding:10px;
  border:1px solid #ffffff22;
  border-radius:8px;
  background:#111b18;
  color:white;
  font-size:16px;
}

.send{
  border:0;
  border-radius:8px;
  background:#3278cf;
  color:white;
  padding:8px;
}

/* =========================
   HISTORY
========================= */

#history{
  max-height:360px;
  overflow-y:auto;
}

.historyItem{
  margin-bottom:8px;
  padding:8px;
  border-radius:9px;
  background:#ffffff0d;
}

.historyTitle{
  color:#ffd642;
  font-weight:bold;
}

.historyCards{
  margin-top:5px;
  font-size:13px;
  line-height:1.5;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .top{
    grid-template-columns:95px 1fr 55px;
  }

  .room{
    font-size:9px;
  }

  #roomCode{
    font-size:16px;
  }

  .score{
    gap:5px;
    font-size:9px;
  }

  .scoreNumber{
    font-size:25px;
  }

  .cardPoints{
    font-size:9px;
  }

  .host{
    font-size:9px;
  }

  .layout{
    display:block;
  }

  .tableZone{
    height:500px;
  }

  .table{
    width:97vw;
    height:410px;
    border-width:9px;
  }

  .player{
    width:92px;
  }

  .avatar{
    width:76px;
    height:76px;
  }

  .playerName{
    padding:2px 4px;
    font-size:10px;
  }

  .teamTag{
    font-size:8px;
  }

  .p0{left:-2%;top:17%}
  .p1{left:38%;top:-7%}
  .p2{right:-2%;top:17%}
  .p3{right:0;bottom:4%}
  .p4{left:38%;bottom:-8%}
  .p5{left:0;bottom:4%}

  .centerCards{
    width:240px;
  }

  .centerCards .card{
    width:45px;
    height:67px;
    flex-basis:45px;
  }

  .centerCards .cardTop{
    font-size:12px;
  }

  .centerCards .cardCenter{
    font-size:24px;
  }

  .centerCards .cardBottom{
    font-size:11px;
  }

  .card{
    width:62px;
    height:92px;
    flex-basis:62px;
  }

  .cardCenter{
    font-size:35px;
  }

  .cardTop{
    font-size:17px;
  }

  .cardBottom{
    font-size:16px;
  }

  #hand{
    justify-content:flex-start;
  }

  .side{
    margin-top:10px;
  }

}

</style>

</head>

<body>

<!-- LOBBY -->

<div id="lobby">

<h1>🃏 Șeptică 3v3</h1>

<p>
Alege echipa înainte să intri.
</p>

<input
  id="name"
  maxlength="20"
  placeholder="Numele tău"
>

<div class="teamChoice">

Echipa 1

  id="chooseTeam2"

>

>

<input

>
Intră în cameră

<!-- GAME -->

<div

<script src="/socket.io/socket.io.js"></script>

<script>

const socket =
  io();

let roomCode =
  null;

let mySeat =
  null;

let state =
  null;

let hand =
  [];

let chosenTeam =
  null;

const avatars = [
  "/player1.png",
  "/player2.png",
  "/player3.png",
  "/player4.png",
  "/player5.png",
  "/player6.png"
];

function e(id){
  return document
    .getElementById(id);
}

/* =========================
   TEAM CHOICE
========================= */

function chooseTeam(team){

  chosenTeam =
    team;

  e("chooseTeam1")
    .classList
    .toggle(
      "selected",
      team === 1
    );

  e("chooseTeam2")
    .classList
    .toggle(
      "selected",
      team === 2
    );
}

function changeTeam(team){

  socket.emit(
    "changeTeam",
    {
      code:
        roomCode,

      team
    },
    response=>{

      if(
        !response.ok
      ){
        alert(
          response.error
        );
      }
    }
  );
}

/* =========================
   ROOM
========================= */

function createRoom(){

  if(!chosenTeam){
    return showError(
      "Alege Echipa 1 sau Echipa 2."
    );
  }

  socket.emit(
    "createRoom",
    {
      name:
        e("name")
          .value
          .trim(),

      team:
        chosenTeam
    },
    response=>{

      if(
        !response.ok
      ){
        return showError(
          response.error
        );
      }

      enter(
        response.code,
        response.seat
      );
    }
  );
}

function joinRoom(){

  if(!chosenTeam){
    return showError(
      "Alege Echipa 1 sau Echipa 2."
    );
  }

  socket.emit(
    "joinRoom",
    {
      code:
        e("code")
          .value
          .trim(),

      name:
        e("name")
          .value
          .trim(),

      team:
        chosenTeam
    },
    response=>{

      if(
        !response.ok
      ){
        return showError(
          response.error
        );
      }

      enter(
        response.code,
        response.seat
      );
    }
  );
}

function enter(
  code,
  seat
){

  roomCode =
    code;

  mySeat =
    seat;

  e("lobby")
    .classList
    .add(
      "hidden"
    );

  e("game")
    .classList
    .remove(
      "hidden"
    );

  e("roomCode")
    .textContent =
    code;
}

socket.on(
  "seat",
  seat=>{

    mySeat =
      seat;

    render();
  }
);

/* =========================
   GAME
========================= */

function fillWithBots(){

  socket.emit(
    "fillWithBots",
    {
      code:
        roomCode
    },
    response=>{

      if(
        !response.ok
      ){
        alert(
          response.error
        );
      }
    }
  );
}

function startGame(){

  socket.emit(
    "startGame",
    {
      code:
        roomCode
    },
    response=>{

      if(
        !response.ok
      ){
        alert(
          response.error
        );
      }
    }
  );
}

function continueRound(){

  socket.emit(
    "continueRound",
    {
      code:
        roomCode
    },
    response=>{

      if(
        !response.ok
      ){
        alert(
          response.error
        );
      }
    }
  );
}

function stopRound(){

  socket.emit(
    "stopRound",
    {
      code:
        roomCode
    },
    response=>{

      if(
        !response.ok
      ){
        alert(
          response.error
        );
      }
    }
  );
}

function playCard(index){

  socket.emit(
    "playCard",
    {
      code:
        roomCode,

      index
    },
    response=>{

      if(
        !response.ok
      ){
        alert(
          response.error
        );
      }
    }
  );
}

/* =========================
   KICK
========================= */

function kickPlayer(seat){

  const player =
    state.players[
      seat
    ];

  if(!player){
    return;
  }

  if(
    !confirm(
      `Dai afară pe ${player.name}?`
    )
  ){
    return;
  }

  socket.emit(
    "kickPlayer",
    {
      code:
        roomCode,

      seat
    },
    response=>{

      if(
        !response.ok
      ){
        alert(
          response.error
        );
      }
    }
  );
}

socket.on(
  "kicked",
  ()=>{

    alert(
      "Host-ul te-a dat afară."
    );

    location.reload();
  }
);

/* =========================
   CHAT
========================= */

e("chatForm")
  .addEventListener(
    "submit",
    event=>{

      event.preventDefault();

      const text =
        e("chatInput")
          .value
          .trim();

      if(!text){
        return;
      }

      socket.emit(
        "chatMessage",
        {
          code:
            roomCode,

          text
        },
        response=>{

          if(
            response &&
            !response.ok
          ){
            alert(
              response.error
            );

            return;
          }

          e("chatInput")
            .value =
            "";
        }
      );
    }
  );

socket.on(
  "chatMessage",
  message=>{

    const box =
      document
        .createElement(
          "div"
        );

    box.className =
      "chatMessage";

    box.innerHTML =
      `<span class="chatName">${escapeHTML(message.name)}:</span> ${escapeHTML(message.text)}`;

    e("chatMessages")
      .appendChild(
        box
      );

    e("chatMessages")
      .scrollTop =
      e("chatMessages")
        .scrollHeight;
  }
);

function escapeHTML(value){

  const div =
    document
      .createElement(
        "div"
      );

  div.textContent =
    String(value);

  return div.innerHTML;
}

/* =========================
   TABS
========================= */

function showTab(tab){

  const chat =
    tab ===
    "chat";

  e("chatPage")
    .classList
    .toggle(
      "active",
      chat
    );

  e("historyPage")
    .classList
    .toggle(
      "active",
      !chat
    );

  e("chatTab")
    .classList
    .toggle(
      "active",
      chat
    );

  e("historyTab")
    .classList
    .toggle(
      "active",
      !chat
    );
}

/* =========================
   STATE
========================= */

socket.on(
  "state",
  newState=>{

    state =
      newState;

    render();
  }
);

socket.on(
  "hand",
  newHand=>{

    hand =
      newHand;

    render();
  }
);

/* =========================
   CARDS
========================= */

function red(card){

  return(
    card.suit === "♥" ||
    card.suit === "♦"
  );
}

function cardHTML(card){

  return `

    <div class="cardTop">
      ${card.rank}<br>
      ${card.suit}
    </div>

    <div class="cardCenter">
      ${card.suit}
    </div>

    <div class="cardBottom">
      ${card.rank}<br>
      ${card.suit}
    </div>

  `;
}

/* =========================
   HISTORY
========================= */

function renderHistory(){

  const box =
    e("history");

  box.innerHTML =
    "";

  const history =
    state.history ||
    [];

  if(
    history.length === 0
  ){
    box.innerHTML =
      "<div>Nu există încă runde terminate.</div>";

    return;
  }

  [...history]
    .reverse()
    .forEach(
      item=>{

        const row =
          document
            .createElement(
              "div"
            );

        row.className =
          "historyItem";

        const cards =
          item.cards
            .map(
              card=>
                `${escapeHTML(card.name)}: ${card.rank}${card.suit}${card.cut ? " ✂️" : ""}`
            )
            .join("<br>");

        row.innerHTML = `

          <div class="historyTitle">

            Runda ${item.round}

          </div>

          <div>

            A început:
            ${escapeHTML(item.openerName)}
            (${item.openingRank})

          </div>

          <div>

            A luat:
            ${escapeHTML(item.winnerName)}
            — Echipa ${item.winnerTeam}

          </div>

          <div>

            Puncte:
            ${item.points}

          </div>

          <div class="historyCards">

            ${cards}

          </div>

        `;

        box.appendChild(
          row
        );
      }
    );
}

/* =========================
   RENDER
========================= */

function render(){

  if(!state){
    return;
  }

  e("matchScore1")
    .textContent =
    state.matchScore1 ??
    0;

  e("matchScore2")
    .textContent =
    state.matchScore2 ??
    0;

  e("points1")
    .textContent =
    state.cardPoints1 ??
    0;

  e("points2")
    .textContent =
    state.cardPoints2 ??
    0;

  e("piles1")
    .textContent =
    state.piles1 ??
    0;

  e("piles2")
    .textContent =
    state.piles2 ??
    0;

  e("roundNumber")
    .textContent =
    state.roundNumber ??
    1;

  e("status")
    .textContent =
    state.message ||
    "";

  const host =
    socket.id ===
    state.hostId;

  e("host")
    .textContent =
    host
      ? "👑 Tu"
      : "👑";

  const count =
    state.players
      .filter(Boolean)
      .length;

  const team1Count =
    state.players
      .filter(
        p =>
          p &&
          p.team === 1
      )
      .length;

  const team2Count =
    state.players
      .filter(
        p =>
          p &&
          p.team === 2
      )
      .length;

  e("botButton")
    .classList
    .toggle(
      "hidden",
      !(
        host &&
        !state.started &&
        count < 6
      )
    );

  e("startButton")
    .classList
    .toggle(
      "hidden",
      !(
        host &&
        !state.started &&
        count === 6 &&
        team1Count === 3 &&
        team2Count === 3
      )
    );

  e("startButton")
    .textContent =
    state.gameFinished
      ? "▶ Partidă nouă"
      : "▶ Pornește";

  e("teamControls")
    .classList
    .toggle(
      "hidden",
      state.started
    );

  /* RESULT */

  if(
    state.lastResult
  ){
    e("lastResult")
      .classList
      .remove(
        "hidden"
      );

    e("lastResult")
      .textContent =
      state.lastResult;
  }else{
    e("lastResult")
      .classList
      .add(
        "hidden"
      );
  }

  /* DECISION */

  e("decisionControls")
    .classList
    .toggle(
      "hidden",
      !(
        state.started &&
        state.awaitingDecision &&
        state.opener ===
          mySeat
      )
    );

  /* TURN */

  if(
    state.awaitingDecision
  ){
    const opener =
      state.players[
        state.opener
      ];

    e("turnMessage")
      .textContent =
      state.opener ===
      mySeat
        ? "Alegi: Continui sau oprești runda?"
        : `${opener?.name || "Jucătorul"} decide.`;
  }

  else if(
    state.started
  ){
    const current =
      state.players[
        state.turn
      ];

    e("turnMessage")
      .textContent =
      state.turn ===
      mySeat
        ? (
            state.continuationMode
              ? `🟢 Alege ${state.openingRank}, 7 sau 8`
              : "🟢 Rândul tău"
          )
        : `Rândul lui ${current?.name || "jucător"}`;
  }

  else{
    e("turnMessage")
      .textContent =
      `Echipa 1: ${team1Count}/3 • Echipa 2: ${team2Count}/3`;
  }

  /* PLAYERS */

  const players =
    e("players");

  players.innerHTML =
    "";

  for(
    let index = 0;
    index < 6;
    index++
  ){
    const player =
      state.players[
        index
      ];

    const box =
      document
        .createElement(
          "div"
        );

    box.className =
      `player p${index}`;

    if(!player){

      box.innerHTML = `

        <div
          style="
            width:70px;
            height:70px;
            border:2px dashed #ffffff55;
            border-radius:50%;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:center;
            opacity:.5;
          "
        >
          +
        </div>

        <div class="playerName">
          Loc liber
        </div>

      `;

      players.appendChild(
        box
      );

      continue;
    }

    if(
      state.started &&
      state.turn ===
        index
    ){
      box.classList.add(
        "active"
      );
    }

    let kick =
      "";

    if(
      host &&
      !state.started &&
      index !==
        mySeat
    ){
      kick = `

        <button
          class="kick"
          onclick="kickPlayer(${index})"
        >
          ✕ Dă afară
        </button>

      `;
    }

    box.innerHTML = `

      <img
        class="avatar"
        src="${avatars[index]}"
      >

      <br>

      <div class="playerName">

        ${escapeHTML(player.name)}

        ${
          index === mySeat
            ? " (Tu)"
            : ""
        }

      </div>

      <br>

      <div
        class="teamTag ${
          player.team === 1
            ? "t1"
            : "t2"
        }"
      >

        Echipa ${player.team}

        ${
          player.bot
            ? " 🤖"
            : ""
        }

      </div>

      ${kick}

    `;

    players.appendChild(
      box
    );
  }

  /* TABLE */

  const table =
    state.table ||
    [];

  const center =
    e("centerCards");

  center.innerHTML =
    "";

  table.forEach(
    play=>{

      const card =
        document
          .createElement(
            "div"
          );

      card.className =
        "card";

      if(
        red(
          play.card
        )
      ){
        card.classList.add(
          "red"
        );
      }

      card.innerHTML =
        cardHTML(
          play.card
        );

      center.appendChild(
        card
      );
    }
  );

  if(
    state.openingRank
  ){
    e("firstCard")
      .textContent =
      state.openingRank;

    e("cuts")
      .textContent =
      `${state.openingRank}, 7 sau 8`;
  }else{
    e("firstCard")
      .textContent =
      "-";

    e("cuts")
      .textContent =
      "7 și 8";
  }

  /* HAND */

  const handBox =
    e("hand");

  handBox.innerHTML =
    "";

  hand.forEach(
    (
      card,
      index
    )=>{

      const element =
        document
          .createElement(
            "div"
          );

      element.className =
        "card";

      if(
        red(card)
      ){
        element.classList.add(
          "red"
        );
      }

      let canPlay =
        state.started &&
        state.turn ===
          mySeat &&
        !state.awaitingDecision;

      if(
        state.continuationMode &&
        state.turn ===
          mySeat
      ){
        canPlay =
          card.rank === "7" ||
          card.rank === "8" ||
          card.rank ===
            state.openingRank;
      }

      if(canPlay){
        element.classList.add(
          "canPlay"
        );

        element.onclick =
          () =>
            playCard(
              index
            );
      }else{
        element.classList.add(
          "disabled"
        );
      }

      element.innerHTML =
        cardHTML(
          card
        );

      handBox.appendChild(
        element
      );
    }
  );

  renderHistory();
}

function showError(text){

  e("error")
    .textContent =
    text;
}

</script>

</body>

</html>
