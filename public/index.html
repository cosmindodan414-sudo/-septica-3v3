<!DOCTYPE html>
<html lang="ro">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Șeptică 3v3</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:white;

  background:
    radial-gradient(
      circle at 50% 30%,
      #51321d,
      #20140c 45%,
      #070806
    );
}

.hidden{
  display:none!important;
}

button,
input{
  font-family:inherit;
}

/* LOBBY */

#lobby{
  width:min(92%,430px);
  margin:60px auto;
  padding:25px;
  background:#07110ff2;
  border-radius:22px;
  text-align:center;
}

#lobby input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ffffff25;
  border-radius:10px;
  background:#111c18;
  color:white;
  font-size:16px;
}

.mainButton{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:0;
  border-radius:11px;
  background:#33983c;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.blue{
  background:#285faf;
}

#error{
  color:#ff8888;
}

/* GAME */

#game{
  padding:10px;
}

.panel{
  background:#071019ef;
  border:1px solid #ffffff20;
  border-radius:14px;
}

.top{
  max-width:1450px;
  margin:auto;
  display:grid;
  grid-template-columns:180px 1fr 120px;
  gap:8px;
}

.room{
  padding:10px;
}

#roomCode{
  display:block;
  color:#ffd642;
  font-size:25px;
  font-weight:bold;
}

.score{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
}

.scoreNumber{
  font-size:38px;
  font-weight:bold;
}

.team1{
  color:#8ff05a;
}

.team2{
  color:#65a4ff;
}

.cardPointsBar{
  text-align:center;
  margin-top:5px;
  color:#ddd;
  font-size:13px;
}

.host{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffd642;
  font-weight:bold;
}

.layout{
  max-width:1450px;
  margin:10px auto;
  display:grid;
  grid-template-columns:1fr 260px;
  gap:10px;
}

/* TABLE */

.tableZone{
  position:relative;
  height:650px;
}

.table{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);

  width:min(1050px,82vw);
  height:530px;

  border-radius:50%;
  border:16px solid #6b391d;

  background:
    radial-gradient(
      ellipse,
      #2c7d3e,
      #175c2b 65%,
      #0b3d1e
    );

  box-shadow:
    inset 0 0 50px #0008,
    0 25px 50px #000b;
}

.player{
  position:absolute;
  width:150px;
  text-align:center;
  z-index:10;
}

.avatar{
  width:120px;
  height:120px;
  object-fit:contain;
}

.player.active .avatar{
  filter:
    drop-shadow(0 0 8px #aaff30)
    drop-shadow(0 0 18px #86ff00);
}

.playerName{
  display:inline-block;
  background:#111d;
  border-radius:8px;
  padding:4px 8px;
  font-weight:bold;
}

.teamTag{
  display:inline-block;
  margin-top:3px;
  padding:3px 7px;
  border-radius:6px;
  font-size:12px;
}

.t1{
  background:#276f1c;
}

.t2{
  background:#17478d;
}

.p0{left:5%;top:15%}
.p1{left:43%;top:-10%}
.p2{right:5%;top:15%}
.p3{right:4%;bottom:3%}
.p4{left:43%;bottom:-11%}
.p5{left:4%;bottom:3%}

/* CARDS ON TABLE */

.centerCards{
  position:absolute;
  left:50%;
  top:49%;

  transform:
    translate(-50%,-50%);

  width:380px;

  min-height:180px;

  display:flex;
  flex-wrap:wrap;

  justify-content:center;
  align-content:center;

  gap:6px;
}

/* CARDS */

.card{
  position:relative;

  width:82px;
  height:120px;

  flex:0 0 82px;

  border-radius:9px;

  background:#fff9ed;
  color:#111;

  border:1px solid #d2c7b1;

  box-shadow:
    0 5px 12px #0008;

  user-select:none;
}

.red{
  color:#ce241c;
}

.cardTop{
  position:absolute;
  top:5px;
  left:7px;

  font-family:
    Georgia,
    serif;

  font-size:22px;

  font-weight:bold;
}

.cardCenter{
  position:absolute;
  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:48px;
}

.cardBottom{
  position:absolute;
  right:7px;
  bottom:5px;

  transform:
    rotate(180deg);

  font-family:
    Georgia,
    serif;

  font-size:21px;

  font-weight:bold;
}

/*
  CĂRȚILE DE PE MASĂ
  sunt mai mici și
  nu se suprapun.
*/

.centerCards .card{
  width:58px;
  height:86px;
  flex:0 0 58px;
}

.centerCards .cardTop{
  font-size:15px;
}

.centerCards .cardCenter{
  font-size:31px;
}

.centerCards .cardBottom{
  font-size:14px;
}

.handPanel{
  padding:10px;
  margin-top:-10px;
  text-align:center;
}

#hand{
  display:flex;
  justify-content:center;
  gap:5px;
  overflow-x:auto;
}

.canPlay{
  cursor:pointer;
}

.disabled{
  opacity:.55;
  pointer-events:none;
}

#turnMessage{
  margin-bottom:8px;
  color:#ffd642;
  font-weight:bold;
}

/* CONTROLS */

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin:7px;
}

.action{
  padding:11px 15px;
  border:0;
  border-radius:9px;
  color:white;
  font-weight:bold;
}

.start{
  background:#369a3b;
}

.bot{
  background:#6a49b8;
}

.continue{
  background:#34a447;
}

.stop{
  background:#b93b3b;
}

.kick{
  margin-top:4px;
  padding:5px;
  border:0;
  border-radius:6px;
  color:white;
  background:#ad2828;
}

/* RESULT */

.resultBox{
  margin:8px;
  padding:8px;
  border-radius:9px;
  background:#ffffff0d;
  color:#ffd642;
  font-weight:bold;
  text-align:center;
}

/* CHAT */

.side{
  padding:10px;
  min-width:0;
}

.chatTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

#chatMessages{
  height:280px;
  overflow-y:auto;
  background:#02070680;
  border-radius:10px;
  padding:8px;
}

.chatMessage{
  margin:5px 0;
  padding:6px 8px;
  background:#ffffff0e;
  border-radius:7px;
  word-break:break-word;
}

.chatName{
  font-weight:bold;
  color:#ffd642;
}

.chatForm{
  margin-top:8px;
  display:flex;
  gap:5px;
}

#chatInput{
  min-width:0;
  flex:1;
  padding:10px;

  border:
    1px solid #ffffff22;

  border-radius:9px;

  background:#111b18;

  color:white;

  font-size:16px;
}

.send{
  border:0;
  border-radius:9px;
  padding:10px;
  background:#3278cf;
  color:white;
  font-weight:bold;
}

.info{
  margin-top:12px;
  font-size:13px;
  color:#bbb;
}

/* MOBILE */

@media(max-width:850px){

  .top{
    grid-template-columns:
      95px 1fr 55px;
  }

  .room{
    font-size:9px;
  }

  #roomCode{
    font-size:16px;
  }

  .score{
    gap:5px;
    font-size:9px;
  }

  .scoreNumber{
    font-size:25px;
  }

  .cardPointsBar{
    font-size:10px;
  }

  .host{
    font-size:9px;
  }

  .layout{
    display:block;
  }

  .tableZone{
    height:500px;
  }

  .table{
    width:97vw;
    height:410px;
    border-width:9px;
  }

  .player{
    width:92px;
  }

  .avatar{
    width:76px;
    height:76px;
  }

  .playerName{
    padding:2px 4px;
    font-size:10px;
  }

  .teamTag{
    font-size:8px;
  }

  .p0{left:-2%;top:17%}
  .p1{left:38%;top:-7%}
  .p2{right:-2%;top:17%}
  .p3{right:0;bottom:4%}
  .p4{left:38%;bottom:-8%}
  .p5{left:0;bottom:4%}

  .centerCards{
    width:240px;
  }

  .centerCards .card{
    width:46px;
    height:68px;
    flex-basis:46px;
  }

  .centerCards .cardTop{
    font-size:12px;
  }

  .centerCards .cardCenter{
    font-size:25px;
  }

  .centerCards .cardBottom{
    font-size:11px;
  }

  .card{
    width:62px;
    height:92px;
    flex-basis:62px;
  }

  .cardCenter{
    font-size:35px;
  }

  .cardTop{
    font-size:17px;
  }

  .cardBottom{
    font-size:16px;
  }

  #hand{
    justify-content:flex-start;
  }

  .side{
    margin-top:10px;
  }

  #chatMessages{
    height:180px;
  }
}

</style>

</head>

<body>

<div id="lobby">

<h1>🃏 Șeptică 3v3</h1>

<p>
6 jucători • Echipa 1 vs Echipa 2
</p>

<input
  id="name"
  maxlength="20"
  placeholder="Numele tău"
>

<button
  class="mainButton"
  onclick="createRoom()"
>
Creează cameră
</button>

<input
  id="code"
  maxlength="6"
  inputmode="numeric"
  placeholder="Cod cameră"
>

  class="mainButton blue"
  onclick="joinRoom()"
>
Intră în cameră

</div>


<div
  id="game"
  class="hidden"
>

<div class="top">

<div class="room panel">

Cod cameră

------
</span>

</div>


<div class="panel">

<div class="score">

<div class="team1">
ECHIPA 1
</div>

<span
  id="matchScore1"
  class="scoreNumber team1"
>
0
</span>

<div>
-
</div>

<span
  id="matchScore2"
  class="scoreNumber team2"
>
0
</span>

ECHIPA 2

</div>

Puncte cărți:
<strong id="cardPoints1">0</strong>

  id="host"

<div>

  id="centerCards"
  class="centerCards"
></div>

</div>

Așteptăm...

  id="lastResult"
  class="resultBox hidden"
></div>

>

  class="action continue"
  onclick="continueRound()"
>
▶ Continuă runda

</div>


<div class="controls">

  class="action bot hidden"
  onclick="fillWithBots()"
>
🤖 Test cu 5 boți
</button>

  class="action start hidden"
  onclick="startGame()"
>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket =
  io();

let roomCode =
  null;

let mySeat =
  null;

let state =
  null;

let hand =
  [];

const avatars = [
  "/player1.png",
  "/player2.png",
  "/player3.png",
  "/player4.png",
  "/player5.png",
  "/player6.png"
];

function e(id) {
  return document
    .getElementById(id);
}

/* =========================
   ROOM
========================= */

function createRoom() {
  socket.emit(
    "createRoom",
    {
      name:
        e("name")
          .value
          .trim()
    },
    response => {

      if (
        !response.ok
      ) {
        return showError(
          response.error
        );
      }

      enter(
        response.code,
        response.seat
      );
    }
  );
}

function joinRoom() {
  socket.emit(
    "joinRoom",
    {
      code:
        e("code")
          .value
          .trim(),

      name:
        e("name")
          .value
          .trim()
    },
    response => {

      if (
        !response.ok
      ) {
        return showError(
          response.error
        );
      }

      enter(
        response.code,
        response.seat
      );
    }
  );
}

function enter(
  code,
  seat
) {
  roomCode =
    code;

  mySeat =
    seat;

  e("lobby")
    .classList
    .add("hidden");

  e("game")
    .classList
    .remove("hidden");

  e("roomCode")
    .textContent =
    code;
}

socket.on(
  "seat",
  seat => {
    mySeat =
      seat;

    render();
  }
);

/* =========================
   BOTS
========================= */

function fillWithBots() {
  socket.emit(
    "fillWithBots",
    {
      code:
        roomCode
    },
    response => {

      if (
        !response.ok
      ) {
        alert(
          response.error
        );
      }
    }
  );
}

/* =========================
   START
========================= */

function startGame() {
  socket.emit(
    "startGame",
    {
      code:
        roomCode
    },
    response => {

      if (
        !response.ok
      ) {
        alert(
          response.error
        );
      }
    }
  );
}

/* =========================
   CONTINUE / STOP
========================= */

function continueRound() {
  socket.emit(
    "continueRound",
    {
      code:
        roomCode
    },
    response => {

      if (
        !response.ok
      ) {
        alert(
          response.error
        );
      }
    }
  );
}

function stopRound() {
  socket.emit(
    "stopRound",
    {
      code:
        roomCode
    },
    response => {

      if (
        !response.ok
      ) {
        alert(
          response.error
        );
      }
    }
  );
}

/* =========================
   PLAY CARD
========================= */

function playCard(
  index
) {
  socket.emit(
    "playCard",
    {
      code:
        roomCode,

      index
    },
    response => {

      if (
        !response.ok
      ) {
        alert(
          response.error
        );
      }
    }
  );
}

/* =========================
   KICK
========================= */

function kickPlayer(
  seat
) {
  const player =
    state.players[
      seat
    ];

  if (!player) {
    return;
  }

  if (
    !confirm(
      `Dai afară pe ${player.name}?`
    )
  ) {
    return;
  }

  socket.emit(
    "kickPlayer",
    {
      code:
        roomCode,

      seat
    },
    response => {

      if (
        !response.ok
      ) {
        alert(
          response.error
        );
      }
    }
  );
}

socket.on(
  "kicked",
  () => {
    alert(
      "Host-ul te-a dat afară."
    );

    location.reload();
  }
);

/* =========================
   CHAT
========================= */

e("chatForm")
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();

      const text =
        e("chatInput")
          .value
          .trim();

      if (!text) {
        return;
      }

      socket.emit(
        "chatMessage",
        {
          code:
            roomCode,

          text
        },
        response => {

          if (
            response &&
            !response.ok
          ) {
            alert(
              response.error
            );

            return;
          }

          e("chatInput")
            .value =
            "";
        }
      );
    }
  );

socket.on(
  "chatMessage",
  message => {

    const box =
      document
        .createElement(
          "div"
        );

    box.className =
      "chatMessage";

    box.innerHTML =
      `<span class="chatName">${escapeHTML(message.name)}:</span> ${escapeHTML(message.text)}`;

    e("chatMessages")
      .appendChild(
        box
      );

    e("chatMessages")
      .scrollTop =
      e("chatMessages")
        .scrollHeight;
  }
);

function escapeHTML(
  value
) {
  const div =
    document
      .createElement(
        "div"
      );

  div.textContent =
    String(value);

  return div.innerHTML;
}

/* =========================
   STATE
========================= */

socket.on(
  "state",
  newState => {
    state =
      newState;

    render();
  }
);

socket.on(
  "hand",
  newHand => {
    hand =
      newHand;

    render();
  }
);

/* =========================
   CARD
========================= */

function red(card) {
  return (
    card.suit === "♥" ||
    card.suit === "♦"
  );
}

function cardHTML(
  card
) {
  return `

    <div class="cardTop">
      ${card.rank}<br>
      ${card.suit}
    </div>

    <div class="cardCenter">
      ${card.suit}
    </div>

    <div class="cardBottom">
      ${card.rank}<br>
      ${card.suit}
    </div>

  `;
}

/* =========================
   RENDER
========================= */

function render() {
  if (!state) {
    return;
  }

  /* SCOR PARTIDE */

  e("matchScore1")
    .textContent =
    state.matchScore1 ??
    0;

  e("matchScore2")
    .textContent =
    state.matchScore2 ??
    0;

  /* PUNCTE CĂRȚI */

  e("cardPoints1")
    .textContent =
    state.cardPoints1 ??
    0;

  e("cardPoints2")
    .textContent =
    state.cardPoints2 ??
    0;

  e("piles1")
    .textContent =
    state.piles1 ??
    0;

  e("piles2")
    .textContent =
    state.piles2 ??
    0;

  e("statusMessage")
    .textContent =
    state.message ||
    "";

  const host =
    socket.id ===
    state.hostId;

  e("host")
    .textContent =
    host
      ? "👑 Tu"
      : "👑 Host";

  const count =
    state.players
      .filter(Boolean)
      .length;

  /* BUTON BOȚI */

  e("botButton")
    .classList
    .toggle(
      "hidden",
      !(
        host &&
        !state.started &&
        count < 6
      )
    );

  /*
    START apare și după
    terminarea partidei,
    ca să pornești alta.
  */

  e("startButton")
    .classList
    .toggle(
      "hidden",
      !(
        host &&
        !state.started &&
        count === 6
      )
    );

  e("startButton")
    .textContent =
    state.gameFinished
      ? "▶ Partidă nouă"
      : "▶ Pornește partida";

  /* RESULT */

  if (
    state.lastResult
  ) {
    e("lastResult")
      .classList
      .remove(
        "hidden"
      );

    e("lastResult")
      .textContent =
      state.lastResult;
  } else {
    e("lastResult")
      .classList
      .add(
        "hidden"
      );
  }

  /* DECISION */

  const decision =
    state.started &&
    state.awaitingDecision &&
    state.opener ===
      mySeat;

  e("decisionControls")
    .classList
    .toggle(
      "hidden",
      !decision
    );

  /* TURN */

  if (
    state.awaitingDecision
  ) {
    const opener =
      state.players[
        state.opener
      ];

    e("turnMessage")
      .textContent =
      state.opener ===
      mySeat
        ? "Alegi dacă runda continuă."
        : `${opener?.name || "Jucătorul"} decide dacă continuă.`;
  }

  else if (
    state.started
  ) {
    const player =
      state.players[
        state.turn
      ];

    e("turnMessage")
      .textContent =
      state.turn ===
      mySeat
        ? (
            state.continuationMode
              ? `🟢 Alege ${state.openingRank}, 7 sau 8`
              : "🟢 Rândul tău"
          )
        : `Rândul lui ${player?.name || "jucător"}`;
  }

  else if (
    state.gameFinished
  ) {
    e("turnMessage")
      .textContent =
      `Partida s-a terminat ${state.cardPoints1}-${state.cardPoints2}`;
  }

  else {
    e("turnMessage")
      .textContent =
      `${count}/6 jucători la masă`;
  }

  /* PLAYERS */

  const players =
    e("players");

  players.innerHTML =
    "";

  for (
    let index = 0;
    index < 6;
    index++
  ) {
    const player =
      state.players[
        index
      ];

    const box =
      document
        .createElement(
          "div"
        );

    box.className =
      `player p${index}`;

    if (!player) {
      box.innerHTML = `

        <div
          style="
            width:70px;
            height:70px;
            border:2px dashed #ffffff55;
            border-radius:50%;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:center;
            opacity:.5;
          "
        >
          +
        </div>

        <div class="playerName">
          Loc liber
        </div>
      `;

      players.appendChild(
        box
      );

      continue;
    }

    if (
      state.started &&
      state.turn ===
        index
    ) {
      box.classList.add(
        "active"
      );
    }

    let kick =
      "";

    if (
      host &&
      !state.started &&
      index !==
        mySeat
    ) {
      kick = `

        <button
          class="kick"
          onclick="kickPlayer(${index})"
        >
          ✕ Dă afară
        </button>
      `;
    }

    box.innerHTML = `

      <img
        class="avatar"
        src="${avatars[index]}"
      >

      <br>

      <div class="playerName">

        ${escapeHTML(player.name)}

        ${
          index === mySeat
            ? " (Tu)"
            : ""
        }

      </div>

      <br>

      <div
        class="teamTag ${
          player.team === 1
            ? "t1"
            : "t2"
        }"
      >

        Echipa ${player.team}

        ${
          player.bot
            ? " 🤖"
            : ""
        }

      </div>

      ${kick}
    `;

    players.appendChild(
      box
    );
  }

  /* TABLE */

  const table =
    state.table ||
    state.trick ||
    [];

  const center =
    e("centerCards");

  center.innerHTML =
    "";

  table.forEach(
    play => {

      const c =
        document
          .createElement(
            "div"
          );

      c.className =
        "card";

      if (
        red(play.card)
      ) {
        c.classList.add(
          "red"
        );
      }

      c.innerHTML =
        cardHTML(
          play.card
        );

      center.appendChild(
        c
      );
    }
  );

  e("playedCount")
    .textContent =
    table.length;

  if (
    state.openingRank
  ) {
    e("firstCard")
      .textContent =
      state.openingRank;

    e("cuts")
      .textContent =
      `${state.openingRank}, 7 sau 8`;
  } else {
    e("firstCard")
      .textContent =
      "-";

    e("cuts")
      .textContent =
      "7 și 8";
  }

  /* HAND */

  const handBox =
    e("hand");

  handBox.innerHTML =
    "";

  hand.forEach(
    (
      card,
      index
    ) => {

      const c =
        document
          .createElement(
            "div"
          );

      c.className =
        "card";

      if (
        red(card)
      ) {
        c.classList.add(
          "red"
        );
      }

      let canPlay =
        state.started &&
        state.turn ===
          mySeat &&
        !state.awaitingDecision;

      if (
        state.continuationMode &&
        state.turn ===
          mySeat
      ) {
        canPlay =
          card.rank === "7" ||
          card.rank === "8" ||
          card.rank ===
            state.openingRank;
      }

      if (canPlay) {
        c.classList.add(
          "canPlay"
        );

        c.onclick =
          () =>
            playCard(
              index
            );
      } else {
        c.classList.add(
          "disabled"
        );
      }

      c.innerHTML =
        cardHTML(
          card
        );

      handBox.appendChild(
        c
      );
    }
  );
}

function showError(
  text
) {
  e("error")
    .textContent =
    text;
}

</script>

</body>
</html>
